[package]
name = "llama-rust"
version = "0.1.0"
edition = "2021"
description = "Rust library and CLI for running GGUF models through llama.cpp"
license = "MIT"
repository = "https://github.com/dhhieu113pro/llama-rust"

[lib]
name = "llama_rust"
path = "src/lib.rs"

[[bin]]
name = "llama-rust"
path = "src/main.rs"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
llama-cpp-2 = "0.1.154"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
