[workspace]
members = [".", "crates/llama-sys"]
resolver = "2"

[package]
name = "rs-llama"
version = "0.2.0"
edition = "2021"
description = "Rust library and CLI for running GGUF models through llama.cpp"
license = "MIT"
repository = "https://github.com/dhhieu113pro/rs-llama"
homepage = "https://dhhieu113pro.github.io/rs-llama"
readme = "README.md"
keywords = ["llm", "llama", "gguf", "llama-cpp"]
categories = ["command-line-utilities", "api-bindings"]
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[lib]
name = "rs_llama"
path = "src/lib.rs"

[[bin]]
name = "rs-llama"
path = "src/main.rs"

[features]
default = []
cuda = ["llama-sys/cuda"]
vulkan = ["llama-sys/vulkan"]
metal = ["llama-sys/metal"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
llama-sys = { package = "rs-llama-sys", version = "0.1.2", path = "crates/llama-sys" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
