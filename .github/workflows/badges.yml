name: Generate Badges

on:
  workflow_dispatch:
  # Uncomment to auto-regenerate on main pushes if desired
  # push:
  #   branches: [main]
  #   paths:
  #     - 'scripts/generate-badges.sh'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate badges
        run: |
          chmod +x scripts/generate-badges.sh
          ./scripts/generate-badges.sh assets/badges

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges/
          if git diff --staged --quiet; then
            echo "No badge changes"
          else
            git commit -m "chore: regenerate badges"
            git push
          fi
