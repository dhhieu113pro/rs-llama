name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: rs-llama-linux-x86_64
          - name: Windows x64
            os: windows-latest
            artifact: rs-llama-windows-x86_64
          - name: macOS
            os: macos-latest
            artifact: rs-llama-macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: smollm2-135m-instruct-q4-k-m-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --prompt "Write one short sentence about Rust." \
            --max-tokens 24 \
            --ctx-size 512 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "Smoke test produced $(wc -c < smoke-output.txt) bytes of output"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rs-llama dist/rs-llama
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" rs-llama

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rs-llama dist/rs-llama
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" rs-llama

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rs-llama.exe dist\rs-llama.exe
          Compress-Archive -Path dist\rs-llama.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload Linux/macOS artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: ls -lah dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
