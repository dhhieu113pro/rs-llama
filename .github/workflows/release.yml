name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: rs-llama-linux-x86_64
            binary: rs-llama
          - name: Windows x64
            os: windows-latest
            artifact: rs-llama-windows-x86_64
            binary: rs-llama.exe
          - name: macOS
            os: macos-latest
            artifact: rs-llama-macos
            binary: rs-llama

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: smollm2-135m-instruct-q4-k-m-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --prompt "What is LED lamp?" \
            --max-tokens 48 \
            --ctx-size 512 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "Smoke test produced $(wc -c < smoke-output.txt) bytes of output"
          echo "----- model output -----"
          cat smoke-output.txt

      - name: Upload tested Linux/macOS binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.artifact }}
          path: target/release/rs-llama
          if-no-files-found: error

      - name: Upload tested Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.artifact }}
          path: target/release/rs-llama.exe
          if-no-files-found: error

  package:
    name: Package binaries
    needs: test
    if: success() && (github.event_name != 'pull_request')
    runs-on: ubuntu-latest

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: bins
          merge-multiple: false

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          ls -R bins

          cp "bins/tested-rs-llama-linux-x86_64/rs-llama" dist/rs-llama
          tar -C dist -czf rs-llama-linux-x86_64.tar.gz rs-llama
          rm dist/rs-llama

          cp "bins/tested-rs-llama-macos/rs-llama" dist/rs-llama
          tar -C dist -czf rs-llama-macos.tar.gz rs-llama
          rm dist/rs-llama

          cp "bins/tested-rs-llama-windows-x86_64/rs-llama.exe" dist/rs-llama.exe
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('rs-llama-windows-x86_64.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.write('dist/rs-llama.exe', 'rs-llama.exe')
          PY
          rm dist/rs-llama.exe
          mv rs-llama-linux-x86_64.tar.gz rs-llama-macos.tar.gz rs-llama-windows-x86_64.zip dist/
          ls -lah dist

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-llama-packages
          path: |
            dist/rs-llama-linux-x86_64.tar.gz
            dist/rs-llama-macos.tar.gz
            dist/rs-llama-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, package]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: rs-llama-packages
          path: dist

      - name: Show release files
        run: ls -lah dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
