name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: rs-llama-linux-x86_64
            binary: rs-llama
          - name: Windows x64
            os: windows-latest
            artifact: rs-llama-windows-x86_64
            binary: rs-llama.exe
          - name: macOS arm64
            os: macos-latest
            artifact: rs-llama-macos-arm64
            binary: rs-llama

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-smollm2-smolvlm-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --chat \
            --no-echo-prompt \
            --prompt "What is an LED lamp?" \
            --max-tokens 80 \
            --ctx-size 1024 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          if ! grep -qiE 'led|light|diode|lamp|electric|bulb' smoke-output.txt; then
            echo "Smoke test did not answer the LED lamp question"
            exit 1
          fi

      - name: Smoke test vision mmproj + image
        shell: bash
        run: bash scripts/ci-vision-smoke.sh

      - name: Upload tested Linux/macOS binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.artifact }}
          path: target/release/rs-llama
          if-no-files-found: error

      - name: Upload tested Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.artifact }}
          path: target/release/rs-llama.exe
          if-no-files-found: error

  android:
    name: Build Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: cargo generate-lockfile
      - name: Cross-compile aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 28 build --release --bin rs-llama
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: tested-rs-llama-android-arm64
          path: target/aarch64-linux-android/release/rs-llama
          if-no-files-found: error

  package:
    name: Package binaries
    needs: [test, android]
    if: success() && (github.event_name != 'pull_request')
    runs-on: ubuntu-latest

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: bins
          merge-multiple: false

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          ls -R bins

          pack_unix() {
            local artifact="$1"
            local src="bins/tested-${artifact}/rs-llama"
            test -f "$src"
            mkdir -p "pack/${artifact}"
            cp "$src" "pack/${artifact}/rs-llama"
            chmod +x "pack/${artifact}/rs-llama"
            tar -C pack -czf "dist/${artifact}.tar.gz" "${artifact}"
          }

          pack_unix rs-llama-linux-x86_64
          pack_unix rs-llama-macos-arm64
          pack_unix rs-llama-android-arm64

          mkdir -p pack/rs-llama-windows-x86_64
          cp bins/tested-rs-llama-windows-x86_64/rs-llama.exe pack/rs-llama-windows-x86_64/rs-llama.exe
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/rs-llama-windows-x86_64.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.write('pack/rs-llama-windows-x86_64/rs-llama.exe', 'rs-llama-windows-x86_64/rs-llama.exe')
          PY

          (cd dist && sha256sum * > SHA256SUMS)
          ls -lah dist
          cat dist/SHA256SUMS

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-llama-packages
          path: |
            dist/rs-llama-linux-x86_64.tar.gz
            dist/rs-llama-macos-arm64.tar.gz
            dist/rs-llama-windows-x86_64.zip
            dist/rs-llama-android-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, android, package]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: rs-llama-packages
          path: dist

      - name: Show release files
        run: ls -lah dist && cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  crates-io:
    name: Publish to crates.io
    needs: [test]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish rs-llama-sys (FFI crate first)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p rs-llama-sys --locked --allow-dirty

      - name: Wait for crates.io index to update
        run: sleep 45

      - name: Publish rs-llama
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p rs-llama --locked --allow-dirty
