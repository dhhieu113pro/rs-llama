name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            artifact: rs-llama-linux-x86_64
            binary: rs-llama
          - name: Windows x64
            os: windows-latest
            platform: windows
            artifact: rs-llama-windows-x86_64
            binary: rs-llama.exe
          - name: macOS arm64
            os: macos-latest
            platform: macos
            artifact: rs-llama-macos-arm64
            binary: rs-llama

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Install CUDA toolkit
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          linux-local-args: '["--toolkit"]'
          log-file-suffix: '${{ matrix.platform }}.txt'

      - name: Install Vulkan SDK
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Verify GPU build toolchains
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          nvcc --version
          glslc --version
          test -n "${VULKAN_SDK:-}"

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-smollm2-smolvlm-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Run default/static unit tests
        run: cargo test --release

      - name: Build dynamic release bundle
        run: cargo build --release --features dynamic-backends

      - name: Stage dynamic runtime package
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/rs-llama-package
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          cp "target/release/${{ matrix.binary }}" "$PACKAGE_DIR/${{ matrix.binary }}"

          if [ "${{ matrix.platform }}" = "windows" ]; then
            find target/release/build -type f \
              \( -iname 'llama*.dll' -o -iname 'ggml*.dll' \) \
              -exec cp -f {} "$PACKAGE_DIR/" \;
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            find target/release/build -type f \
              \( -name 'libllama*.dylib' -o -name 'libggml*.dylib' -o -name 'libggml*.so' \) \
              -exec cp -Lf {} "$PACKAGE_DIR/" \;
          else
            find target/release/build -type f \
              \( -name 'libllama.so*' -o -name 'libggml*.so*' \) \
              -exec cp -Lf {} "$PACKAGE_DIR/" \;
          fi

          echo "----- staged runtime package -----"
          ls -lah "$PACKAGE_DIR"

      - name: Verify packaged runtime backends and CPU fallback
        shell: bash
        run: bash scripts/verify-release-package.sh "${{ runner.temp }}/rs-llama-package" "${{ matrix.platform }}"

      - name: Smoke test vision from packaged runtime
        shell: bash
        run: bash scripts/ci-vision-smoke.sh "${{ runner.temp }}/rs-llama-package/${{ matrix.binary }}"

      - name: Upload tested runtime package
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.artifact }}
          path: ${{ runner.temp }}/rs-llama-package/**
          if-no-files-found: error

  android:
    name: Build Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: cargo generate-lockfile
      - name: Cross-compile aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 28 build --release --bin rs-llama
      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: tested-rs-llama-android-arm64
          path: target/aarch64-linux-android/release/rs-llama
          if-no-files-found: error

  package:
    name: Package binaries
    needs: [test, android]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: bins
          merge-multiple: false

      - name: Package release archives
        run: |
          set -euo pipefail
          rm -rf pack dist
          mkdir -p pack dist
          ls -R bins

          pack_runtime_unix() {
            local artifact="$1"
            local src="bins/tested-${artifact}"
            test -d "$src"
            mkdir -p "pack/${artifact}"
            cp -a "$src"/. "pack/${artifact}/"
            chmod +x "pack/${artifact}/rs-llama"
            tar -C pack -czf "dist/${artifact}.tar.gz" "${artifact}"
          }

          pack_runtime_unix rs-llama-linux-x86_64
          pack_runtime_unix rs-llama-macos-arm64

          mkdir -p pack/rs-llama-android-arm64
          cp bins/tested-rs-llama-android-arm64/rs-llama pack/rs-llama-android-arm64/rs-llama
          chmod +x pack/rs-llama-android-arm64/rs-llama
          tar -C pack -czf dist/rs-llama-android-arm64.tar.gz rs-llama-android-arm64

          mkdir -p pack/rs-llama-windows-x86_64
          cp -a bins/tested-rs-llama-windows-x86_64/. pack/rs-llama-windows-x86_64/
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path('pack/rs-llama-windows-x86_64')
          with zipfile.ZipFile('dist/rs-llama-windows-x86_64.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in root.rglob('*'):
                  if path.is_file():
                      zf.write(path, path.relative_to(root.parent).as_posix())
          PY

          unzip -l dist/rs-llama-windows-x86_64.zip | grep -Ei 'ggml-cpu'
          unzip -l dist/rs-llama-windows-x86_64.zip | grep -Ei 'ggml-cuda'
          unzip -l dist/rs-llama-windows-x86_64.zip | grep -Ei 'ggml-vulkan'
          tar -tzf dist/rs-llama-linux-x86_64.tar.gz | grep -Ei 'ggml-cpu'
          tar -tzf dist/rs-llama-linux-x86_64.tar.gz | grep -Ei 'ggml-cuda'
          tar -tzf dist/rs-llama-linux-x86_64.tar.gz | grep -Ei 'ggml-vulkan'
          tar -tzf dist/rs-llama-macos-arm64.tar.gz | grep -Ei 'ggml-cpu'
          tar -tzf dist/rs-llama-macos-arm64.tar.gz | grep -Ei 'ggml-metal|metal'

          (cd dist && sha256sum * > SHA256SUMS)
          ls -lah dist
          cat dist/SHA256SUMS

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-llama-packages
          path: |
            dist/rs-llama-linux-x86_64.tar.gz
            dist/rs-llama-macos-arm64.tar.gz
            dist/rs-llama-windows-x86_64.zip
            dist/rs-llama-android-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [test, android, package]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: rs-llama-packages
          path: dist

      - name: Show release files
        run: ls -lah dist && cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  crates-io:
    name: Publish to crates.io
    needs: [test]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Refresh lockfile
        run: cargo generate-lockfile

      - name: Publish rs-llama-sys (FFI crate first)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p rs-llama-sys --locked --allow-dirty

      - name: Wait for crates.io index to update
        run: sleep 45

      - name: Publish rs-llama
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p rs-llama --locked --allow-dirty
