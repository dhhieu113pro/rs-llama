name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Test CPU ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            cargo_features: ""
          - name: Windows x64
            os: windows-latest
            cargo_features: ""
          - name: macOS Metal
            os: macos-latest
            cargo_features: "--features metal"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-smollm2-smolvlm-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release ${{ matrix.cargo_features }}

      - name: Run unit tests
        run: cargo test --release ${{ matrix.cargo_features }}

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --chat \
            --no-echo-prompt \
            --prompt "What is an LED lamp?" \
            --max-tokens 80 \
            --ctx-size 1024 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "----- model answer -----"
          cat smoke-output.txt
          if ! grep -qiE 'led|light|diode|lamp|electric|bulb' smoke-output.txt; then
            echo "Smoke test did not answer the LED lamp question"
            exit 1
          fi

      - name: Smoke test vision mmproj + image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/rs-llama
          python3 - <<'PY'
          from pathlib import Path
          Path('testdata').mkdir(exist_ok=True)
          # 1x1 yellow PNG
          Path('testdata/led-lamp.png').write_bytes(bytes.fromhex(
              '89504e470d0a1a0a0000000d4948445200000001000000010802000000907753de'
              '0000000c4944415408d763f8ff33c00000030101d5d45f8b0000000049454e44ae426082'
          ))
          PY
          "$BIN" \
            --hf-repo ggml-org/SmolVLM-256M-Instruct-GGUF \
            --hf-file SmolVLM-256M-Instruct-Q8_0.gguf \
            --image testdata/led-lamp.png \
            --chat \
            --no-echo-prompt \
            --prompt "What is an LED lamp?" \
            --max-tokens 48 \
            --ctx-size 2048 \
            --threads 2 \
            >vision-output.txt 2>vision-stderr.txt
          echo "----- vision stderr -----"
          cat vision-stderr.txt
          echo "----- vision stdout -----"
          cat vision-output.txt
          if ! grep -qiE 'mmproj|vision' vision-stderr.txt; then
            echo "Vision test did not download or attach mmproj"
            exit 1
          fi
          test -s vision-output.txt
          ls -lah models | tee vision-models.txt
          if ! ls models | grep -qi mmproj; then
            echo "No mmproj file cached in models/"
            exit 1
          fi

  backends:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan Linux
            os: ubuntu-latest
            features: vulkan
          - name: CUDA Linux
            os: ubuntu-latest
            features: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install Vulkan SDK
        if: matrix.features == 'vulkan'
        run: sudo apt-get install -y libvulkan-dev glslc mesa-vulkan-drivers

      - name: Install CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.6.3"
          method: network
          use-github-cache: true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: backend-${{ matrix.features }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Compile backend
        run: cargo build --release --features ${{ matrix.features }}
