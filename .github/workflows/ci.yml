name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Test CPU ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS Metal
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: smollm2-135m-instruct-q4-k-m-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build CPU release binary
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build Metal release binary
        if: runner.os == 'macOS'
        run: cargo build --release --features metal

      - name: Run unit tests
        run: cargo test --release --features ${{ runner.os == 'macOS' && 'metal' || '' }}

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --chat \
            --no-echo-prompt \
            --prompt "What is an LED lamp?" \
            --max-tokens 80 \
            --ctx-size 1024 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "----- model answer -----"
          cat smoke-output.txt
          if ! grep -qiE 'led|light|diode|lamp|electric|bulb' smoke-output.txt; then
            echo "Smoke test did not answer the LED lamp question"
            exit 1
          fi

  backends:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan Linux
            os: ubuntu-latest
            features: vulkan
          - name: CUDA Linux
            os: ubuntu-latest
            features: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install Vulkan SDK
        if: matrix.features == 'vulkan'
        run: sudo apt-get install -y libvulkan-dev glslc mesa-vulkan-drivers

      - name: Install CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.6.3"
          method: network
          use-github-cache: true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: backend-${{ matrix.features }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Compile backend
        run: cargo build --release --features ${{ matrix.features }}
