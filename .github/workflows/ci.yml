name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test LLM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: smollm2-135m-instruct-q4-k-m

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run unit tests
        run: cargo test --release --locked

      - name: Smoke test LLM inference
        run: |
          set -euo pipefail
          ./target/release/rs-llama \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --prompt "Write one short sentence about Rust." \
            --max-tokens 24 \
            --ctx-size 512 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "Smoke test produced $(wc -c < smoke-output.txt) bytes of output"
