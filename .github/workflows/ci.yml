name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Test CPU ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            cargo_features: ""
          - name: Windows x64
            os: windows-latest
            cargo_features: ""
          - name: macOS Metal
            os: macos-latest
            cargo_features: "--features metal"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-smollm2-smolvlm-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release ${{ matrix.cargo_features }}

      - name: Run unit tests
        run: cargo test --release ${{ matrix.cargo_features }}

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --chat \
            --no-echo-prompt \
            --prompt "What is an LED lamp?" \
            --max-tokens 80 \
            --ctx-size 1024 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "----- model answer -----"
          cat smoke-output.txt
          if ! grep -qiE 'led|light|diode|lamp|electric|bulb' smoke-output.txt; then
            echo "Smoke test did not answer the LED lamp question"
            exit 1
          fi

      - name: Smoke test vision mmproj + image
        shell: bash
        run: bash scripts/ci-vision-smoke.sh

  backends:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vulkan Linux
            os: ubuntu-latest
            features: vulkan
          - name: CUDA Linux
            os: ubuntu-latest
            features: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install Vulkan SDK
        if: matrix.features == 'vulkan'
        run: |
          sudo apt-get install -y \
            libvulkan-dev \
            glslc \
            glslang-dev \
            glslang-tools \
            spirv-headers \
            spirv-tools \
            mesa-vulkan-drivers

      - name: Install CUDA build toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["compiler", "libraries-dev"]'
          use-github-cache: true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: backend-${{ matrix.features }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Compile backend
        run: cargo build --release --features ${{ matrix.features }}

  android:
    name: Build Android arm64 (Termux target)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Cross-compile aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 28 build --release --bin rs-llama

      - name: Show Android binary
        run: |
          find target -name rs-llama -type f | tee android-bins.txt
          test -s android-bins.txt

  android-vision:
    name: Vision smoke Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-linux-android
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev python3-pip
          python3 -m pip install --user pillow || true
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: cargo generate-lockfile
      - name: Cross-compile x86_64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t x86_64 --platform 28 build --release --bin rs-llama
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run vision smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-vision-smoke.sh target/x86_64-linux-android/release/rs-llama

  termux-scripts:
    name: Check Termux scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Termux scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n scripts/termux-build.sh
          bash -n scripts/termux-smoke.sh
          bash -n scripts/ci-vision-smoke.sh
          bash -n scripts/android-vision-smoke.sh
          shellcheck -e SC2164,SC1091 scripts/termux-build.sh scripts/termux-smoke.sh scripts/ci-vision-smoke.sh scripts/android-vision-smoke.sh
