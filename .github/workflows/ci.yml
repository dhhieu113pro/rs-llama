name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake --no-progress -y
          clang --version
          cmake --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache downloaded GGUF models
        uses: actions/cache@v4
        with:
          path: models
          key: smollm2-135m-instruct-q4-k-m-${{ runner.os }}

      - name: Refresh lockfile after crate rename
        run: cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Smoke test LLM inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/rs-llama.exe ]; then
            BIN=target/release/rs-llama.exe
          else
            BIN=target/release/rs-llama
          fi
          "$BIN" \
            --hf-repo mradermacher/SmolLM2-135M-Instruct-GGUF \
            --hf-file SmolLM2-135M-Instruct.Q4_K_M.gguf \
            --prompt "What is LED lamp?" \
            --max-tokens 48 \
            --ctx-size 512 \
            --threads 2 \
            | tee smoke-output.txt
          test -s smoke-output.txt
          echo "Smoke test produced $(wc -c < smoke-output.txt) bytes of output"
          echo "----- model output -----"
          cat smoke-output.txt
