name: Backend policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-policy:
    name: Backend selection policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run pure Rust policy tests
        run: |
          rustc --edition=2021 --test crates/llama-sys/tests/backend_selection.rs -o /tmp/backend-selection-tests
          /tmp/backend-selection-tests
