[package]
name = "rs-llama-sys"
version = "0.1.2"
edition = "2021"
description = "Direct FFI bindings to llama.cpp (used by rs-llama)"
license = "MIT"
repository = "https://github.com/dhhieu113pro/rs-llama"
homepage = "https://github.com/dhhieu113pro/rs-llama"
links = "llama"

[lib]
name = "llama_sys"
path = "src/lib.rs"

[features]
default = []
cuda = []
vulkan = []
metal = []

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"
